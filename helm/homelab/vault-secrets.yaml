apiVersion: v1
kind: ServiceAccount
metadata:
  name: homeboard-runtime-vso
  namespace: homeboard
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: homeboard-runtime-vso
  namespace: homeboard
spec:
  address: https://vault-vso.vault.svc.cluster.local:8443
  tlsServerName: vault-vso.techdrabble.com
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: homeboard-runtime-vso
  namespace: homeboard
spec:
  vaultConnectionRef: homeboard-runtime-vso
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: homeboard-runtime-vso
    serviceAccount: homeboard-runtime-vso
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: homeboard-runtime-vso
  namespace: homeboard
spec:
  vaultAuthRef: homeboard-runtime-vso
  type: kv-v2
  mount: kv
  path: apps/homeboard/runtime
  refreshAfter: 1m
  destination:
    name: homeboard-secrets-vault
    create: true
