image:
  repository: butlerrc30/homeboard
  tag: "v0.2.11"
  # Defaults to "<tag>-tools" when empty. Override only when publishing a custom tooling image tag.
  toolsTag: ""
  pullPolicy: IfNotPresent
replicaCount: 2
service:
  port: 3000
ingress:
  enabled: true
  className: traefik
  host: homeboard.example.internal
  tlsSecret: ""
config:
  appName: Homeboard
  databaseUrl: ""
  allowDemo: false
secrets:
  existingSecret: homeboard-secrets
  databaseUrlKey: DATABASE_URL
  sessionSecretKey: SESSION_SECRET
resources:
  web: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
  worker: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
postgres:
  enabled: false
  # Use a managed or separately deployed PostgreSQL service in production.
seed:
  # Creates the sample household only when no household exists.
  enabled: false
