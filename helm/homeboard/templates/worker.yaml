apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homeboard.fullname" . }}-worker
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "homeboard.name" . }}, app.kubernetes.io/component: worker } }
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ include "homeboard.name" . }}, app.kubernetes.io/component: worker } }
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["node", "node_modules/tsx/dist/cli.mjs", "src/worker.ts"]
          envFrom: [{ configMapRef: { name: {{ include "homeboard.fullname" . }} } }]
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: {{ .Values.secrets.databaseUrlKey }} } } }
          resources: {{- toYaml .Values.resources.worker | nindent 12 }}
