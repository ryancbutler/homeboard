apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homeboard.fullname" . }}-worker
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "homeboard.name" . }}, app.kubernetes.io/component: worker } }
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ include "homeboard.name" . }}, app.kubernetes.io/component: worker } }
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ default (printf "%s-tools" .Values.image.tag) .Values.image.toolsTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/src/worker.js"]
          envFrom: [{ configMapRef: { name: {{ include "homeboard.fullname" . }} } }]
          env:
            {{- if eq (include "homeboard.usesSecretDatabaseUrl" .) "true" }}
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: {{ .Values.secrets.databaseUrlKey }} } } }
            {{- else }}
            - { name: DATABASE_URL, value: {{ include "homeboard.databaseUrl" . | quote }} }
            {{- end }}
          {{- if eq (include "homeboard.usesSqlite" .) "true" }}
          volumeMounts: [{ name: sqlite-data, mountPath: /data }]
          {{- end }}
          resources: {{- toYaml .Values.resources.worker | nindent 12 }}
      {{- if eq (include "homeboard.usesSqlite" .) "true" }}
      volumes:
        - name: sqlite-data
          persistentVolumeClaim: { claimName: {{ include "homeboard.fullname" . }}-sqlite }
      {{- end }}
