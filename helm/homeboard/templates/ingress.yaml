{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: {{ include "homeboard.fullname" . }} }
spec:
  {{- if .Values.ingress.className }}ingressClassName: {{ .Values.ingress.className }}{{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ include "homeboard.fullname" . }}, port: { name: http } } } }] }
{{- end }}
