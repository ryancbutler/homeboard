services:
  migrate:
    build:
      context: .
      target: runtime-tools
    command: ["node", "dist/scripts/migrate.js"]
    environment: &homeboard-env
      DATABASE_URL: file:/data/homeboard.db
      SESSION_SECRET: local-development-only-change-me-please
      PARENT_PIN: "1234"
      ALLOW_DEMO: "true"
    volumes: &homeboard-data
      - sqlite-data:/data

  seed:
    build:
      context: .
      target: runtime-tools
    command: ["node", "dist/scripts/seed.js"]
    environment: *homeboard-env
    volumes: *homeboard-data
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      target: runtime-web
    restart: unless-stopped
    environment: *homeboard-env
    volumes: *homeboard-data
    ports: ["3000:3000"]
    depends_on:
      seed: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/dashboard').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      target: runtime-tools
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    environment: *homeboard-env
    volumes: *homeboard-data
    depends_on:
      seed: { condition: service_completed_successfully }

volumes:
  sqlite-data:
