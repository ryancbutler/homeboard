name: Publish tagged container images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            butlerrc30/homeboard
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set tooling image metadata
        id: tooling-metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            butlerrc30/homeboard
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=-tools,onlatest=true
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-web
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push tooling image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-tools
          push: true
          tags: ${{ steps.tooling-metadata.outputs.tags }}
          labels: ${{ steps.tooling-metadata.outputs.labels }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools
