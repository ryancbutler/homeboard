name: Auto-release and publish containers

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read application version
        id: version
        shell: bash
        run: node -p "'value=' + require('./package.json').version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        id: release
        uses: actions/github-script@v7
        env:
          TAG: v${{ steps.version.outputs.value }}
        with:
          script: |
            const tag = process.env.TAG;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`Release ${tag} already exists; skipping.`);
              core.setOutput('created', 'false');
            } catch (error) {
              if (error.status !== 404) throw error;

              const release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                generate_release_notes: true,
              });

              core.info(`Created release: ${release.data.html_url}`);
              core.setOutput('created', 'true');
            }

            // Always publish on a run. This makes the workflow recoverable if
            // a prior run created the release but failed while pushing images.
            core.setOutput('publish', 'true');

      - name: Log in to Docker Hub
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        if: steps.release.outputs.publish == 'true'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            butlerrc30/homeboard
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.value }}
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.value, '-') }}

      - name: Set up Docker Buildx
        if: steps.release.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Set tooling image metadata
        if: steps.release.outputs.publish == 'true'
        id: tooling-metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            butlerrc30/homeboard
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.value }}-tools
            type=raw,value=${{ steps.version.outputs.value }}-tools
            type=raw,value=latest-tools,enable=${{ !contains(steps.version.outputs.value, '-') }}

      - name: Build and push web image
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-web
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push tooling image
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-tools
          push: true
          tags: ${{ steps.tooling-metadata.outputs.tags }}
          labels: ${{ steps.tooling-metadata.outputs.labels }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools
