name: Auto-release and publish containers

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Verify release version consistency
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
          const lockVersion = JSON.parse(readFileSync("package-lock.json", "utf8")).version;
          const chart = readFileSync("helm/homeboard/Chart.yaml", "utf8");
          const values = readFileSync("helm/homeboard/values.yaml", "utf8");

          const field = (contents, name) => {
            const match = contents.match(new RegExp(`^\\s*${name}:\\s*[\"']?([^\"'\\s#]+)`, "m"));
            if (!match) throw new Error(`Could not read ${name}.`);
            return match[1];
          };

          const expected = {
            "package-lock.json version": packageVersion,
            "Chart.yaml version": packageVersion,
            "Chart.yaml appVersion": packageVersion,
            "values.yaml image tag": `v${packageVersion}`,
          };
          const actual = {
            "package-lock.json version": lockVersion,
            "Chart.yaml version": field(chart, "version"),
            "Chart.yaml appVersion": field(chart, "appVersion"),
            "values.yaml image tag": field(values, "tag"),
          };

          const mismatches = Object.entries(expected)
            .filter(([name, value]) => actual[name] !== value)
            .map(([name, value]) => `${name}: expected ${value}, found ${actual[name]}`);

          if (mismatches.length) throw new Error(mismatches.join("\n"));
          console.log(`Release version ${packageVersion} is consistent.`);
          EOF

      - name: Run tests
        run: npm test

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint helm/homeboard

      - name: Render Helm chart
        run: helm template homeboard helm/homeboard --namespace homeboard > /dev/null

      - name: Read application version
        id: version
        shell: bash
        run: node -p "'value=' + require('./package.json').version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        id: release
        uses: actions/github-script@v9
        env:
          TAG: v${{ steps.version.outputs.value }}
        with:
          script: |
            const tag = process.env.TAG;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`Release ${tag} already exists; skipping.`);
              core.setOutput('created', 'false');
            } catch (error) {
              if (error.status !== 404) throw error;

              const release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                generate_release_notes: true,
              });

              core.info(`Created release: ${release.data.html_url}`);
              core.setOutput('created', 'true');
            }

            // Always publish on a run. This makes the workflow recoverable if
            // a prior run created the release but failed while pushing images.
            core.setOutput('publish', 'true');

      - name: Log in to Docker Hub
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        if: steps.release.outputs.publish == 'true'
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            butlerrc30/homeboard
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.value }}
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.value, '-') }}

      - name: Set up Docker Buildx
        if: steps.release.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Set tooling image metadata
        if: steps.release.outputs.publish == 'true'
        id: tooling-metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            butlerrc30/homeboard
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.value }}-tools
            type=raw,value=${{ steps.version.outputs.value }}-tools
            type=raw,value=latest-tools,enable=${{ !contains(steps.version.outputs.value, '-') }}

      - name: Build and push web image
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-web
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push tooling image
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-tools
          push: true
          tags: ${{ steps.tooling-metadata.outputs.tags }}
          labels: ${{ steps.tooling-metadata.outputs.labels }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools
